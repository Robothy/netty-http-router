import io.franzbecker.gradle.lombok.task.DelombokTask

import java.nio.file.Files

plugins {
    id 'java'
    id 'maven-publish'
//    id "com.robothy.cn-repo" version "1.8"
    id "robothy-platform-release"
    id "signing"
    id 'io.franzbecker.gradle-lombok' version '5.0.0'
    id 'org.danilopianini.publish-on-central' version '9.2.12'
}

group 'io.github.robothy'

repositories {
    mavenLocal()
    mavenCentral()
}

ext {
    lombokVersion = "1.18.48"
    nettyVersion = '4.2.18.Final'
    jupiterVersion = "6.1.3"
    slf4jVersion = "2.0.20"
    mockitoVersion = "5.24.0"
    sprintframeworkVersion = "7.0.9"
}

dependencies {
    implementation "io.netty:netty-all:${nettyVersion}"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "org.springframework:spring-web:${sprintframeworkVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${jupiterVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${jupiterVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jupiterVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

java {
//    toolchain {
//        languageVersion = JavaLanguageVersion.of(11)
//    }

    sourceCompatibility(17)
    targetCompatibility(17)
    withSourcesJar()
    withJavadocJar()
}

javadoc.options.addStringOption('Xdoclint:none', '-quiet')

publishing {

    publications {
        // publish-on-central registers the 'OSSRH' publication itself
        // (from components.java). Just add POM metadata to whatever exists.
        withType(MavenPublication) {
            pom {
                name = "Netty Http Router"
                description = 'A Netty HTTP router library.'
                url = 'https://github.com/Robothy/netty-http-router'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'robothy'
                        name = "Fuxiang Luo"
                        email = "robothyluo@gmail.com"
                    }
                }

                scm {
                    url = "https://github.com/Robothy/netty-http-router.git"
                }

            }
        }
    }

    repositories {
        mavenLocal()
        // Only publish to GitHub Packages when a token is provided (CI builds).
        // The release workflow skips it: GitHub Packages rejects re-upload of an
        // existing version (409), which would fail the release on retries.
        if (project.findProperty("GITHUB_TOKEN") != null || System.getenv("GITHUB_TOKEN") != null) {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/Robothy/netty-http-router")
                credentials {
                    username = project.findProperty("GITHUB_USERNAME") ?: System.getenv("GITHUB_USERNAME")
                    password = project.findProperty("GITHUB_TOKEN") ?: System.getenv("GITHUB_TOKEN")
                }
            }
        }

    }
}

signing {
    def signingKey
    if (findProperty("signingKeyRingFile") != null) {
        signingKey = Files.readString(file(findProperty("signing.secretKeyRingFile")).toPath())
    } else {
        signingKey = findProperty("signing.secretKey")
    }
    def signingPassword = findProperty("signing.password")
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.OSSRH
}


// NOTE(2026-09-26): the original task used DelombokTask from
// io.franzbecker:gradle-lombok 5.0.0, which is unmaintained and incompatible with
// Gradle 9. A plain JavaExec invocation of lombok's own launcher does the same job.
task delombok(type: JavaExec, dependsOn: compileJava) {
    classpath = configurations.compileClasspath.filter { it.name.contains('lombok') }
    mainClass = 'lombok.launch.Main'
    doFirst {
        delete file("$buildDir/delombok")
    }
    args(
        'delombok',
        sourceSets.main.java.srcDirs.first(),
        '-d', file("$buildDir/delombok"),
    )
}

javadoc {
    dependsOn delombok
    source = fileTree("$buildDir/delombok")
    // Aggregate poms like netty-all 4.2 resolve to an empty shell jar on the
    // default javadoc classpath variant; reuse the compile classpath explicitly.
    classpath = configurations.compileClasspath
    //failOnError = false
}


// ---- Maven Central Portal publishing (2026-10) ----
// The legacy OSSRH (s01.oss.sonatype.org) publishing is retired; Maven Central
// now ingests artifacts through the Central Portal API. The
// publish-on-central plugin produces the Portal bundle zip; uploadMavenCentralPortal
// POSTs it to https://central.sonatype.com (same approach as local-s3's buildSrc).
// Plugin 'org.danilopianini.publish-on-central' is declared in the plugins block above.
publishOnCentral {
    repoOwner.set('Robothy')
    projectLongName.set('NettyHttpRouter')
    projectDescription.set('A Netty HTTP router library.')
    projectUrl.set('https://github.com/Robothy/netty-http-router')
    scmConnection.set('scm:git:https://github.com/Robothy/netty-http-router')
    licenseName.set('The Apache License, Version 2.0')
    licenseUrl.set('http://www.apache.org/licenses/LICENSE-2.0')
}

tasks.register('uploadMavenCentralPortal') {
    description = 'Uploads the Maven Central Portal zip bundle to central.sonatype.com.'
    group = 'publishing'
    dependsOn tasks.named('zipMavenCentralPortalPublication')

    def uploadTimeoutMinutes = (project.findProperty("MAVEN_CENTRAL_PORTAL_UPLOAD_TIMEOUT_MINUTES") ?: "15") as int

    doLast {
        def zipTask = tasks.named('zipMavenCentralPortalPublication').get()
        def zipFile = zipTask.archiveFile.get().asFile
        if (!zipFile.exists()) {
            throw new GradleException("Zip file not found: ${zipFile.absolutePath}")
        }

        def username = project.findProperty("MAVEN_CENTRAL_PORTAL_USERNAME") ?: System.getenv("MAVEN_CENTRAL_PORTAL_USERNAME")
        def password = project.findProperty("MAVEN_CENTRAL_PORTAL_PASSWORD") ?: System.getenv("MAVEN_CENTRAL_PORTAL_PASSWORD")
        if (!username || !password) {
            throw new GradleException("MAVEN_CENTRAL_PORTAL_USERNAME and MAVEN_CENTRAL_PORTAL_PASSWORD must be set")
        }
        def token = Base64.getEncoder().encodeToString("${username}:${password}".getBytes("UTF-8"))
        def publishingType = project.findProperty("MAVEN_CENTRAL_PORTAL_PUBLISHING_TYPE") ?: "USER_MANAGED"

        def boundary = UUID.randomUUID().toString()
        def CRLF = "\r\n"
        def baos = new ByteArrayOutputStream()
        baos.write("--${boundary}${CRLF}".getBytes("UTF-8"))
        baos.write("Content-Disposition: form-data; name=\"bundle\"; filename=\"${zipFile.name}\"${CRLF}".getBytes("UTF-8"))
        baos.write("Content-Type: application/octet-stream${CRLF}".getBytes("UTF-8"))
        baos.write(CRLF.getBytes("UTF-8"))
        baos.write(zipFile.bytes)
        baos.write("${CRLF}--${boundary}--${CRLF}".getBytes("UTF-8"))

        def encodedName = URLEncoder.encode(zipFile.name, "UTF-8")
        def uploadUrl = "https://central.sonatype.com/api/v1/publisher/upload?name=${encodedName}&publishingType=${publishingType}"

        logger.lifecycle("Uploading ${zipFile.name} (${zipFile.length()} bytes) to Maven Central Portal...")
        logger.lifecycle("Publishing type: ${publishingType}, timeout: ${uploadTimeoutMinutes} minutes")

        def client = java.net.http.HttpClient.newBuilder()
            .connectTimeout(java.time.Duration.ofMinutes(5))
            .build()

        def request = java.net.http.HttpRequest.newBuilder()
            .uri(URI.create(uploadUrl))
            .header("Authorization", "Bearer ${token}")
            .header("Content-Type", "multipart/form-data; boundary=${boundary}")
            .timeout(java.time.Duration.ofMinutes(uploadTimeoutMinutes))
            .POST(java.net.http.HttpRequest.BodyPublishers.ofByteArray(baos.toByteArray()))
            .build()

        def response = client.send(request, java.net.http.HttpResponse.BodyHandlers.ofString())

        if (response.statusCode() == 201) {
            logger.lifecycle("Upload successful! Deployment ID: ${response.body()}")
        } else {
            throw new GradleException("Upload to Maven Central Portal failed with status ${response.statusCode()}: ${response.body()}")
        }
    }
}
